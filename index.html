<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Créditos</title>
  <link rel="stylesheet" href="simulador_completo.css">
</head>
<body>

<header>
  <h1>Sistema Básico de Créditos</h1>
</header>

<nav>
  <!-- Los parámetros de estas funciones ahora coinciden exactamente con los ID de abajo -->
  <button onclick="mostrarSeccion('parametros')">Parámetros</button>
  <button onclick="mostrarSeccion('clientes')">Clientes</button>
  <button onclick="mostrarSeccion('credito')">Créditos</button>
  <button onclick="mostrarSeccion('historial')">Créditos Registrados</button>
  <button onclick="mostrarSeccion('miNombre')">Contacto</button>
</nav>

<section id="miNombre">
  <h2>Creado Por:Isis</h2>
</section>


<section id="parametros">
  <h2>Configurar Parámetros</h2>
  
  <label>Tasa de interés:</label>
  <input type="number" id="tasaInteres" min="10" max="20" value="15">
  <span>%</span>
  
  <br><br>
  <button onclick="guardarTasa()">Guardar tasa</button>
  <p id="mensajeTasa"></p>
</section>

<section id="clientes">
  <h2>Registro de Clientes</h2>

  <input type="text" id="cedulaCli" placeholder="Cédula">
  <input type="text" id="nombreCli" placeholder="Nombre">
  <input type="text" id="apellidoCli" placeholder="Apellido">
  <input type="number" id="ingresosCli" placeholder="Ingresos">
  <input type="number" id="egresosCli" placeholder="Egresos">
  <input type="text" id="correoCli" placeholder="Correo">
  <br>

  <button onclick="guardarCliente()">Guardar cliente</button>
  <button onclick="limpiar()">Limpiar</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Ingresos</th>
        <th>Egresos</th>
        <th>Correo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaClientes">
    </tbody>
  </table>
</section>

<section id="credito">
  <h2>Solicitar Crédito</h2>

  <input type="text" id="buscarCedulaCredito" placeholder="Cédula del cliente">
  <button onclick="buscarClienteCredito()">Buscar cliente</button>

  <div id="datosClienteCredito" class="card"></div>
  <br>

  <input type="number" id="montoCredito" placeholder="Monto del crédito">
  <input type="number" id="plazoCredito" placeholder="Plazo (meses)">

  <br><br>
  <button onclick="calcularCredito()">Calcular crédito</button>

  <div id="resultadoCredito"></div>
  <br>

  <button id="btnSolicitarCredito" onclick="asignarCredito()" disabled>
  Asignar Crédito
  </button>
  </button>
</section>

<section id="historial">
  <h2>Historial de Créditos Registrados</h2>
  
  <input type="text" id="buscarCedulaHistorial" placeholder="Cédula del cliente">
  <button onclick="buscarCreditosCliente()">Buscar Créditos de Cliente</button>
  <button onclick="pintarCreditos(creditos)">Mostrar Todos los Créditos</button>

  <table>
    <thead>
      <tr>
        <th>Cédula</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Monto</th>
        <th>Tasa</th>
        <th>Plazo</th>
        <th>Cuota</th>
      </tr>
    </thead>
    <tbody id="tablaHistorial">
    </tbody>
  </table>
</section>


<!-- Scripts conectados con el nombre exacto de tus archivos -->
<script src="simulador.js"></script>
<script src="utilitarios.js"></script>
</body>
</html>
